<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e0e;

<body class="font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-6 selection:bg-secondary selection:text-on-secondary">
<!-- Top Status Indicator (Supressed Nav Shell Logic for Login) -->
<div class="fixed top-6 right-6 flex items-center gap-2 px-3 py-1 bg-surface-container border border-outline-variant/20">
<span class="material-symbols-outlined text-[14px] text-error" data-icon="cloud_off">cloud_off</span>
<span class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold">Offline Status</span>
</div>
<!-- Background Technical Texture -->
<div class="fixed inset-0 pointer-events-none opacity-5 overflow-hidden z-0">
<div class="absolute inset-0 bg-[radial-gradient(#bbc8d0_1px,transparent_1px)] [background-size:32px_32px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md flex flex-col items-center">
<!-- Header Section -->
<header class="text-center mb-12">
<div class="flex flex-col items-center mb-4">
<div class="w-12 h-1 bg-secondary mb-8"></div>
<h1 class="font-headline text-5xl font-extrabold text-primary tracking-tighter uppercase leading-none">
                    Parinator
                </h1>
<p class="font-label text-[11px] text-secondary uppercase tracking-[0.4em] font-medium mt-4">
                    Tactical Team Pairing Command
                </p>
</div>
</header>
<!-- Command Module (Input Form) -->
<div class="w-full bg-surface-container p-8 shadow-2xl relative overflow-hidden">
<!-- Machined metal accent line -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-primary to-primary-container"></div>
<div class="mb-8">
<label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest font-bold mb-6" for="pin-input">
                    Enter Tactical PIN
                </label>
<div class="flex gap-2 justify-between">
<!-- Standard individual digit pattern for PINs in tactical apps -->
<input class="w-12 h-16 bg-surface-container-highest border-0 border-b-2 border-outline-variant text-center font-headline text-3xl focus:border-secondary focus:ring-0 text-on-surface transition-colors" maxlength="1" type="password" value="•"/>
<input class="w-12 h-16 bg-surface-container-highest border-0 border-b-2 border-outline-variant text-center font-headline text-3xl focus:border-secondary focus:ring-0 text-on-surface transition-colors" maxlength="1" type="password"/>
<input class="w-12 h-16 bg-surface-container-highest border-0 border-b-2 border-outline-variant text-center font-headline text-3xl focus:border-secondary focus:ring-0 text-on-surface transition-colors" maxlength="1" type="password"/>
<input class="w-12 h-16 bg-surface-container-highest border-0 border-b-2 border-outline-variant text-center font-headline text-3xl focus:border-secondary focus:ring-0 text-on-surface transition-colors" maxlength="1" type="password"/>
<input class="w-12 h-16 bg-surface-container-highest border-0 border-b-2 border-outline-variant text-center font-headline text-3xl focus:border-secondary focus:ring-0 text-on-surface transition-colors" maxlength="1" type="password"/>
<input class="w-12 h-16 bg-surface-container-highest border-0 border-b-2 border-outline-variant text-center font-headline text-3xl focus:border-secondary focus:ring-0 text-on-surface transition-colors" maxlength="1" type="password"/>
</div>
</div>
<button class="w-full h-14 bg-secondary text-on-secondary font-headline font-bold text-sm uppercase tracking-widest hover:bg-secondary-dim active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="lock_open">lock_open</span>
                Unlock Command
            </button>
<div class="mt-6 flex justify-between items-center opacity-40">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label text-[9px] px-4 uppercase tracking-tighter">Authorized Personal Only</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
</div>
<!-- Secondary Meta Information Grid (Bento Style Sub-info) -->
<div class="grid grid-cols-2 gap-4 w-full mt-4">
<div class="bg-surface-container-low p-4 border-l-2 border-primary-container">
<span class="font-label text-[9px] text-on-surface-variant uppercase block mb-1">Target Cluster</span>
<span class="font-headline text-xs font-bold text-primary">WTC_2024_FINALS</span>
</div>
<div class="bg-surface-container-low p-4 border-l-2 border-primary-container">
<span class="font-label text-[9px] text-on-surface-variant uppercase block mb-1">Enc Level</span>
<span class="font-headline text-xs font-bold text-primary uppercase">RSA_4096_TAC</span>
</div>
</div>
<!-- Footer -->
<footer class="mt-16 text-center">
<div class="inline-flex items-center gap-4 bg-surface-container-lowest px-4 py-2 border border-outline-variant/10">
<span class="font-label text-[10px] text-secondary font-bold uppercase tracking-widest">Pilot Mode Active</span>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<span class="font-label text-[10px] text-on-surface-variant font-mono uppercase tracking-widest">V0.1.0</span>
</div>
</footer>
</main>
<!-- Visual Anchor: Structural Image (Subtle Data Visualization) -->
<div class="fixed bottom-0 right-0 w-64 h-64 opacity-10 pointer-events-none translate-x-12 translate-y-12">

</div>
</body></html>
